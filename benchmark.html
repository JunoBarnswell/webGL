<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGL 3D 引擎运行时性能基准回归测试 (Benchmark)</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #viewport {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #bench-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 360px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 10000;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      margin: 0 0 14px 0;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .test-item {
      margin-top: 10px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-name { color: #cbd5e1; }
    .test-val { font-family: monospace; font-weight: bold; }
    .status-running { color: #fbbf24; }
    .status-pass { color: #4ade80; }
  </style>
</head>
<body>
  <div id="viewport"></div>

  <div id="bench-panel">
    <h2>⚡ 引擎性能基准回归测试</h2>
    <p>自动化验证加载吞吐、空闲休眠与多次装卸显存生命周期稳定性。</p>
    <button id="btn-start">开始完整基准回归测试</button>

    <div id="results" style="margin-top: 14px;">
      <div class="test-item">
        <span class="test-name">首屏解析耗时 (SceneParser)</span>
        <span class="test-val" id="res-load">等待测试</span>
      </div>
      <div class="test-item">
        <span class="test-name">当前 Draw Calls</span>
        <span class="test-val" id="res-calls">--</span>
      </div>
      <div class="test-item">
        <span class="test-name">静态按需休眠 (Idle)</span>
        <span class="test-val" id="res-idle">--</span>
      </div>
      <div class="test-item">
        <span class="test-name">10 轮组件装卸显存稳定性</span>
        <span class="test-val" id="res-leak">--</span>
      </div>
      <div class="test-item">
        <span class="test-name">P50 / P95 帧时间</span>
        <span class="test-val" id="res-frametime">--</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { ShowroomEngine } from './packages/engine/index.js';

    const container = document.getElementById('viewport');
    const btn = document.getElementById('btn-start');

    const resLoad = document.getElementById('res-load');
    const resCalls = document.getElementById('res-calls');
    const resIdle = document.getElementById('res-idle');
    const resLeak = document.getElementById('res-leak');
    const resFrametime = document.getElementById('res-frametime');

    let engine = null;

    async function init() {
      engine = new ShowroomEngine({
        container,
        showPerf: true,
        onDemand: true
      });
      window.engine = engine;

      btn.addEventListener('click', runAllTests);
    }

    async function runAllTests() {
      btn.disabled = true;
      btn.textContent = '基准测试运行中...';

      // 1. 首屏加载测试
      resLoad.textContent = '加载中...';
      resLoad.className = 'test-val status-running';
      const t0 = performance.now();

      await engine.loadScene({
        sceneUrl: '/model/showroom/scene.json',
        baseUrl: '/model/showroom',
        manifestUrl: '/artworks/manifest.json',
        avatarUrl: '/model/avatar/character.glb'
      });
      const loadTime = Math.round(performance.now() - t0);
      resLoad.textContent = `${loadTime} ms`;
      resLoad.className = 'test-val status-pass';

      // 2. Draw Calls
      const metrics = engine.perfMonitor.getMetrics();
      resCalls.textContent = `${metrics.drawCalls} calls (${metrics.triangles} tris)`;
      resCalls.className = 'test-val status-pass';

      // 3. 静止按需渲染验证
      resIdle.textContent = '等待静止检测...';
      resIdle.className = 'test-val status-running';
      await new Promise(r => setTimeout(r, 600)); // 保持静止 600ms
      const isIdle = engine.frameScheduler.isIdle;
      resIdle.textContent = isIdle ? '已进入休眠 (0% GPU)' : '活跃中';
      resIdle.className = 'test-val status-pass';

      // 4. 10 轮装卸显存测试
      resLeak.textContent = '执行 10 轮装卸...';
      resLeak.className = 'test-val status-running';
      const initialGeoms = engine.renderer.info.memory.geometries;

      for (let i = 0; i < 10; i++) {
        await engine.mountComponent({
          id: 'test_wheel',
          url: '/model/avatar/character.glb'
        });
        engine.unmountComponent('test_wheel');
      }

      const finalGeoms = engine.renderer.info.memory.geometries;
      const leakDiff = finalGeoms - initialGeoms;
      resLeak.textContent = leakDiff <= 0 ? '通过 (0 显存泄漏)' : `异常 (+${leakDiff} geoms)`;
      resLeak.className = 'test-val status-pass';

      // 5. 帧时间分布
      const finalMetrics = engine.perfMonitor.getMetrics();
      resFrametime.textContent = `P50: ${finalMetrics.p50}ms / P95: ${finalMetrics.p95}ms`;
      resFrametime.className = 'test-val status-pass';

      btn.disabled = false;
      btn.textContent = '重新运行基准测试';
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
